<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone preview — TANIX AI 3.0</title>
<style>
  body { margin: 0; min-height: 100vh; background: #15181a; color: #ddd; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px 10px 40px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; color: #d4af37; margin: 0 0 14px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 18px; }
  .tabs button { padding: 8px 16px; color: #ddd; font-size: 13px; cursor: pointer; border: 1px solid #444; border-radius: 999px; background: #20262a; }
  .tabs button.on { color: #171108; border-color: #d4af37; background: #d4af37; font-weight: 700; }
  .phones { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
  .phone { position: relative; padding: 14px; border-radius: 48px; background: #050607; box-shadow: 0 0 0 2px #3a3f44, 0 30px 80px rgba(0,0,0,.7); }
  iframe { display: block; width: 390px; height: 800px; border: 0; border-radius: 34px; background: #000; }
  .cap { margin-top: 10px; text-align: center; font-size: 12px; color: #888; }
</style>
</head>
<body>
<h1>PHONE VIEW · 390 × 800</h1>
<div class="tabs" id="tabs"></div>
<div class="phones" id="phones"></div>
<script>
  const BASE = '';
  const pages = [
    ['Landing', 'index.html'], ['Login', 'login.html'],
    ['Hub (needs login)', 'hub.html'], ['Guide (needs login)', 'guide.html'], ['Terminal (needs login)', 'tanix.html'],
  ];
  let sel = [0, 1];
  function render() {
    const tabs = document.getElementById('tabs'); tabs.textContent = '';
    pages.forEach(([name], i) => {
      const b = document.createElement('button'); b.textContent = name;
      b.className = sel.includes(i) ? 'on' : '';
      b.onclick = () => { sel = sel.includes(i) ? sel.filter(x => x !== i) : [...sel, i].slice(-2); render(); };
      tabs.appendChild(b);
    });
    const wrap = document.getElementById('phones'); wrap.textContent = '';
    sel.forEach(i => {
      const d = document.createElement('div');
      d.innerHTML = '<div class="phone"><iframe src="' + BASE + pages[i][1] + '" title="' + pages[i][0] + '"></iframe></div><div class="cap">' + pages[i][0] + '</div>';
      wrap.appendChild(d);
    });
  }
  render();
</script>
</body>
</html>
