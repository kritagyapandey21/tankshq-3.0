server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/aurox/frontend;
    index index.html;

    # --- compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # --- basic hardening ---
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # never serve dotfiles, logs, or docs that might sit in the frontend folder
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(log|md|sqlite3?|env)$ { deny all; }

    # --- API: /api/* -> FastAPI on localhost ---
    location /api/ {
        client_max_body_size 3m;     # admin winner-photo uploads (limit is 2 MB in the app)
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- static files ---
    # images: cached for a day, refreshed in the background
    location /assets/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }
    # the service worker must always be re-checked so notification fixes reach everyone
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # js/css are versioned with ?v=N in the HTML, so a short cache is safe
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    # clean URLs: /login is served from login.html, and the old /login.html address redirects to /login
    location = /index.html { return 301 /; }
    location ~ ^/(?<page>.+)\.html$ { return 301 /$page$is_args$args; }

    # pages: always revalidate so updates show up immediately
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
